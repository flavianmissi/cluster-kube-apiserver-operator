apiVersion: cloudcredential.openshift.io/v1
kind: CredentialsRequest
metadata:
  name: openshift-apiserver-kms
  namespace: openshift-cloud-credential-operator
  labels:
    app: openshift-apiserver
spec:
  # serviceAccountNames is used for STS mode (IRSA)
  # In Mint mode, this is ignored and CCO creates an IAM user instead
  serviceAccountNames:
  - openshift-apiserver-sa

  providerSpec:
    apiVersion: cloudcredential.openshift.io/v1
    kind: AWSProviderSpec
    statementEntries:
    # KMS permissions required for encryption/decryption
    - effect: Allow
      action:
      - kms:Encrypt
      - kms:Decrypt
      - kms:DescribeKey
      - kms:GenerateDataKey
      resource: "*"
      # NOTE: In production, restrict to specific KMS key ARN:
      # resource: "arn:aws:kms:us-east-1:123456789012:key/your-key-id"

  # Secret will be created in this namespace with this name
  secretRef:
    name: kms-credentials
    namespace: openshift-apiserver
